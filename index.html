<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel = "stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- header -->
  <title>Calculator app</title>
</head>
<body class = "theme-1 d-flex justify-content-center align-items-center">
  <main class = "calculator container-fluid px-0">
    <div class = "top-bar d-flex justify-content-between align-items-end">
      <h1 class = "m-0" >calc</h1>
      <div class = "theme-area d-flex align-items-end">
        <h2 class = "m-0">THEME</h2>
        <div class = "theme-picker">
          <div class = "theme-numbers d-grid">
            <p class = "m-0">1</p>
            <p class = "m-0">2</p>
            <p class = "m-0">3</p>
          </div>
          <div class = "theme-slider">
            <input type="range" min="0" max="2" value="0" id = "theme" class = "form-range" step = "1">
          </div>    
        </div>
      </div>
    </div>
    <!-- screen -->
    <div class = "screen-wrapper">
      <div class = "screen d-flex align-items-center justify-content-end">
        <p id="display" class = "m-0">0</p>
      </div>
    </div>
    <!-- keypad -->
    <div class = "keypad">

      <div class = "row keypad-row">
        <div class = "col-3">
          <button class = "btn key w-100" data-number="7">7</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" data-number="8">8</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" data-number="9">9</button>
        </div>
        <div class = "col-3">
          <button class = "btn key special-key w-100" data-number="delete">DEL</button>
        </div>
      </div>
      <div class = "row keypad-row">
        <div class = "col-3">
          <button class = "btn key w-100" data-number="4">4</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" data-number="5">5</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" data-number="6">6</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" id = "add" data-operator="add">+</button>
        </div>
      </div>
      <div class = "row keypad-row">
        <div class = "col-3">
          <button class = "btn key w-100" data-number="1">1</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" data-number="2">2</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" data-number="3">3</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" id = "subtract" data-operator="subtract">-</button>
        </div>
      </div>
      <div class = "row keypad-row">
        <div class = "col-3">
          <button class = "btn key w-100" data-action="decimal">.</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" data-number="0">0</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" id = "divide" data-operator="divide">/</button>
        </div>
        <div class = "col-3">
          <button class = "btn key w-100" id = "multiply" data-operator="multiply">x</button>
        </div>
      </div>

      <div class = "row keypad-row last-row">
        <div class = "col-6">
          <button class = "btn key special-key w-100" data-action="reset">RESET </button>
        </div>
        <div class = "col-6">
          <button class = "btn key equals-key w-100" data-action="equals"> = </button>
        </div>
      </div>

      <!-- trigonometric functions -->
      <button class="btn key functions-toggle w-100" type="button" data-action="toggle-functions" aria-expanded="false" aria-controls="trigonometric-panel">
        Trigonometric
      </button>

      <div class = "trigonometric row" id="trigonometric-panel" aria-hidden="true">
        <div class = "col-2">
          <button class = "btn key w-100" id = "sin" data-function="sin">sin</button>
        </div>
        <div class = "col-2">
          <button class = "btn key w-100" id = "cos" data-function="cos">cos</button>
        </div>
        <div class = "col-2">
          <button class = "btn key w-100" id = "tan" data-function="tan">tan</button>
        </div>
        <div class = "col-2">
          <button class = "btn key w-100" id = "asin" data-function="asin">asin</button>
        </div>
        <div class = "col-2">
          <button class = "btn key w-100" id = "acos" data-function="acos">acos</button>
        </div>
        <div class = "col-2">
          <button class = "btn key w-100" id = "atan" data-function="atan">atan</button>
        </div>

        
      </div>
    </div>
  </main>
  <script src ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" ></script>
<script src="js/script.js"></script>
</body>
</html>
